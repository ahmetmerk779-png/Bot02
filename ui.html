<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otonom Bot Kontrol Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .online { background: #059669; color: #ecfdf5; }
        .offline { background: #dc2626; color: #fef2f2; }
        .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        .card label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .card .value { font-size: 1.1rem; font-weight: bold; color: #f1f5f9; }
        .chat-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .viewer-btn { display: block; text-align: center; background: #334155; color: #38bdf8; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: 1px solid #475569; }
        .viewer-btn:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Otonom Bot <span id="status-badge" class="status-badge offline">OFFLINE</span></h1>
        
        <div class="card-grid">
            <div class="card"><label>Bot İsmi</label><div class="value" id="username">-</div></div>
            <div class="card"><label>Can</label><div class="value" id="health">- / 20</div></div>
            <div class="card"><label>Açlık</label><div class="value" id="food">- / 20</div></div>
            <div class="card"><label>Konum (X, Y, Z)</label><div class="value" id="position">0, 0, 0</div></div>
        </div>

        <form class="chat-section" id="chat-form">
            <input type="text" id="chat-input" placeholder="Sunucuya canlı mesaj yolla..." required autocomplete="off">
            <button type="submit">Mesaj Gönder</button>
        </form>

        <a id="viewer-link" href="#" target="_blank" class="viewer-btn">🎥 Canlı 3D Ekranı Aç (Port 3007)</a>
    </div>

    <script>
        document.getElementById('viewer-link').href = `http://${window.location.hostname}:3007`;

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const badge = document.getElementById('status-badge');
                if (data.status === 'online') {
                    badge.className = 'status-badge online';
                    badge.innerText = 'ONLINE';
                    document.getElementById('username').innerText = data.username || '-';
                    document.getElementById('health').innerText = (data.health !== undefined ? data.health : '-') + ' / 20';
                    document.getElementById('food').innerText = (data.food !== undefined ? data.food : '-') + ' / 20';
                    document.getElementById('position').innerText = data.position ? `${data.position.x}, ${data.position.y}, ${data.position.z}` : '0, 0, 0';
                } else {
                    badge.className = 'status-badge offline';
                    badge.innerText = 'OFFLINE';
                }
            } catch (err) {
                console.error('Status alınamadı:', err);
            }
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                input.value = '';
            } catch (err) {
                alert('Mesaj iletilemedi!');
            }
        });

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
  </html>
